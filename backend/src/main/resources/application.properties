# Server Configuration
server.port=8000
server.servlet.context-path=/

# MySQL Database Configuration
# Automatically creates the database 'foodeasedb' if it doesn't already exist on MySQL server
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/foodeasedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSON / Jackson Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# Logging
logging.level.com.foodease=INFO
logging.level.org.springframework.web=INFO
